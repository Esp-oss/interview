# docker compose for the banner fingerprint service.
#
# Trust boundaries (this is the "converged access" requirement):
#
#   edge     bridge, reachable from the host through exactly ONE published port.
#            The port is bound to 127.0.0.1 by default, so it is not exposed to
#            the LAN either.  Only the server is attached to it.
#   backend  internal (no route off the host), carries client -> server traffic
#            and nothing else.  The client lives only here, so it has no egress.
#
# Trust flows one way: the client can reach the server, the server can never
# reach the client, and neither container can reach the internet through this
# project's networks.
name: banner-fingerprint

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        VERSION: ${VERSION:-1.0.0}
        # Overridable so the build works behind a registry mirror or with a
        # pinned digest: GO_IMAGE=<registry>/golang:1.26-alpine
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
    image: banner-fingerprint/server:${VERSION:-1.0.0}
    environment:
      PORT: "8080"
      # Empty => use the rule set embedded in the binary.  Point it at
      # /etc/banner-fingerprint/rules (and mount it read-only) to override.
      RULES_DIR: ${RULES_DIR:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_BATCH: ${MAX_BATCH:-5000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      WORKERS: ${WORKERS:-0}
    ports:
      # Loopback by default: the API is reachable from the host, not from the
      # network.  Override API_BIND=0.0.0.0 only on a trusted, isolated host.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    <<: *hardening
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    healthcheck:
      # No shell and no curl inside scratch: the binary probes itself.
      # start_period covers the rule-set compile; retries then tolerate a slow CI box.
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 3s
    networks:
      - edge
      - backend

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
      args:
        VERSION: ${VERSION:-1.0.0}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
    image: banner-fingerprint/client:${VERSION:-1.0.0}
    # A real dependency edge: the client only starts once the server's own health
    # probe has passed, not merely once its container exists.
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: ${SERVER_URL:-http://server:8080}
      INPUT_FILE: /data/input.json
    volumes:
      - "${INPUT_FILE_HOST:-./examples/sample_input.json}:/data/input.json:ro"
    <<: *hardening
    user: "10001:10001"
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    # One-shot by design: run, print, exit 0. compose keeps the server up.
    restart: "no"
    networks:
      - backend

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    # No gateway route: the client cannot reach the internet, and nothing outside
    # this project can reach the client.
    internal: true
