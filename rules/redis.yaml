# Redis
#
# Redis does not advertise a version in a banner, so every Redis answer has an
# empty version field and therefore loses the 0.20 version penalty:
#
#   0.90 (base) - 0.20 (no version) = 0.70
#
# That is the honest number: we are sure it is Redis, we cannot say which build.
#
# Patterns are anchored to the RESP wire format (-ERR / +PONG / :1 / $3 / *2) so
# that an arbitrary sentence starting with "ERR" is not misread as Redis.
version: 1
rules:
  - id: redis-error
    protocol: Redis
    product: Redis
    confidence: 0.90
    priority: 200
    match:
      kind: regex
      pattern: '^-(?:ERR|NOAUTH|WRONGTYPE|MOVED|ASK|DENIED|READONLY|NOSCRIPT|LOADING|MISCONF)\b'
    note: 'Redis answers a probe with a RESP error when it needs AUTH or the command is invalid for the keyspace.'

  - id: redis-pong
    protocol: Redis
    product: Redis
    confidence: 0.90
    priority: 200
    match:
      kind: regex
      pattern: '^\+PONG\r?\n?$'

  - id: redis-ok
    protocol: Redis
    product: Redis
    confidence: 0.90
    priority: 200
    match:
      kind: regex
      # Anchored to end-of-banner on purpose: "+OK POP3 server ready" is POP3.
      pattern: '^\+OK\r?\n?$'

  - id: redis-bulk
    protocol: Redis
    product: Redis
    confidence: 0.88
    priority: 180
    match:
      kind: regex
      pattern: '^\$[0-9]+\r?\n'

  - id: redis-array
    protocol: Redis
    product: Redis
    confidence: 0.88
    priority: 180
    match:
      kind: regex
      pattern: '^\*[0-9]+\r?\n'

  - id: redis-integer
    protocol: Redis
    product: Redis
    confidence: 0.88
    priority: 180
    match:
      kind: regex
      pattern: '^:[0-9]+\r?\n'
